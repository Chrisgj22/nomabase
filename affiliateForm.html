<div class="webWidth">

    <div class="navbarDesktop">
            <div>
                <a href="./index.html"><img src="./assets/img/logo.svg" class="logo"></a>
             </div>
            <div class="desktopMenuList">
            <ul>
                <li><a href="./property-management.html">Property management</a></li>
                <li><a href="https://nomabase.dtravel.com/">Listing</a></li>

        <div class="mobileNav">
            <img id="toggleMenu" src="./assets/img/Hamburger Menu.svg">
        </div>
    </div>
<div class="section1">
  
    <div class="cardR">
        <form name="contactForm" class="contactForm">
            <input name="first name" type="text"  placeholder="First name" required>
            <input name="last name" type="text"  placeholder="Last name" required>
            <input name="email" type="email" placeholder="Email" required>
            <input name="phonenumber" type="number" placeholder="Phone number" required>
            <input name="address" type="text" placeholder="Address" required>
            <input name="zip" type="number" placeholder="Zip" required>
            <input name="state" type="text" placeholder="State" required>
            <input name="country" type="text" placeholder="Country" required>
            <input name="ach" type="text" placeholder="(ach) Automated Clearing House" required>
            <input name="routing" type="text" placeholder="Routing number" required>
            <label for="accept">by submitting I accept the <a href="./terms-and-conditions.html">terms and conditions</a> and confirm that all informations from me entered is correct.</label>
            <input name="accept" type="checkbox" value="accept" checked required>
            <button type="submit" id="contactBtn" class="btnSend">Send</button>
        </form>
    </div>
</div>

<script src="/contact.js"></script>
</div>
</body>
